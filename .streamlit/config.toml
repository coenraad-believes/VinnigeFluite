[browser]
gatherUsageStats = false

[server]
address = "0.0.0.0"  # phones on the same WiFi can connect (see the Network URL)
headless = false
runOnSave = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#e63946"
backgroundColor = "#fff8ee"
secondaryBackgroundColor = "#ffe8cc"
textColor = "#1b1b1b"
